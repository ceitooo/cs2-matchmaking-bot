name: Auto Renew Bot-Hosting

on:
  schedule:
    # Se ejecuta dos veces al día: 00:00 y 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde la pestaña Actions en GitHub
    inputs:
      action:
        description: 'Acción en Bot-Hosting'
        required: true
        default: 'git_pull_and_restart'
        type: choice
        options:
          - git_pull_and_restart
          - restart_only
          - check_only

jobs:
  renew:
    name: Renovar Servidor Bot-Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright y Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Ejecutar script de renovación
        env:
          BOT_HOSTING_COOKIE: ${{ secrets.BOT_HOSTING_COOKIE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_HOSTING_DEPLOYMENT_ID: ${{ secrets.BOT_HOSTING_DEPLOYMENT_ID }}
          ACTION: ${{ github.event.inputs.action || 'check_only' }}
        run: |
          node scripts/auto-renew-bothosting.js

      - name: Subir capturas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renewal-screenshots
          path: screenshots/
          retention-days: 3
